name: Build attested release
on:
  workflow_dispatch:
  push:
    tags: ['[0-9]*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release:check
      - run: npm run check:public
      - name: Check tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'if (process.env.GITHUB_REF_NAME !== require("./manifest.json").version) process.exit(1)'
      - name: Attest runtime assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: learning-coach
          path: |
            main.js
            styles.css
            manifest.json
            dist/learning-coach-*.zip
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" main.js styles.css manifest.json dist/learning-coach-*.zip --verify-tag --draft --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
